# =======================================================
# DeadlineBuddy - Spring Boot Configuration Properties
# =======================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=deadlinebuddy

# -------------------------------------------------------
# H2 File-Based Database Configuration
# Data persists in a local file inside the ./data directory.
# No external MySQL/PostgreSQL server setup is required!
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/deadlinebuddydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
