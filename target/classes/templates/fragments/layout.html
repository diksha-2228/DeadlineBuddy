<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - DeadlineBuddy'">DeadlineBuddy</title>

    <!-- Bootstrap 5 CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- NAVBAR FRAGMENT -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-calendar-check-fill text-warning fs-4"></i>
                <span>DeadlineBuddy</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/' ? 'active' : ''}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/assignments}">
                            <i class="bi bi-list-task me-1"></i> All Assignments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/assignments/new}">
                            <i class="bi bi-plus-circle me-1"></i> Add Assignment
                        </a>
                    </li>
                </ul>

                <!-- Right Utility Badges / Links -->
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/api/assignments}" target="_blank" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1" title="View REST API">
                        <i class="bi bi-braces"></i>
                        <span>REST API</span>
                    </a>
                    <a th:href="@{/h2-console}" target="_blank" class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1" title="Open H2 Database Console">
                        <i class="bi bi-database"></i>
                        <span>H2 DB</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- FLASH MESSAGES FRAGMENT -->
    <div th:fragment="flash_messages" class="container mt-3">
        <!-- Success Alert -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill fs-5"></i>
            <div th:text="${successMessage}">Operation successful!</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <div th:text="${errorMessage}">An error occurred!</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- FOOTER FRAGMENT -->
    <footer th:fragment="footer" class="mt-auto">
        <div class="container text-center">
            <p class="mb-1">
                <strong>DeadlineBuddy</strong> &bull; MCA Advanced Internet Programming (AIP) Mini Project
            </p>
            <p class="mb-0 text-muted small">
                Powered by Spring Boot 3 &bull; Thymeleaf &bull; Spring Data JPA &bull; H2 File Database &bull; Bootstrap 5
            </p>
        </div>
    </footer>

    <!-- SCRIPTS FRAGMENT -->
    <th:block th:fragment="scripts">
        <!-- Bootstrap 5 Bundle JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </th:block>

</body>
</html>
