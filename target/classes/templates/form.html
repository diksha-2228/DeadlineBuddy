<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head(${isEdit} ? 'Edit Assignment' : 'Add New Assignment')}"></head>
<body>

    <!-- Top Navigation -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Flash Notifications -->
    <div th:replace="~{fragments/layout :: flash_messages}"></div>

    <!-- Main Content -->
    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">

                <!-- Navigation Breadcrumb -->
                <nav aria-label="breadcrumb" class="mb-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}">Dashboard</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/assignments}">Assignments</a></li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${isEdit} ? 'Edit Assignment' : 'New Assignment'">Form</li>
                    </ol>
                </nav>

                <!-- Form Card -->
                <div class="card form-card p-4">
                    <div class="border-bottom pb-3 mb-4">
                        <h1 class="h4 fw-bold mb-1">
                            <i th:class="${isEdit} ? 'bi bi-pencil-square text-primary me-2' : 'bi bi-plus-circle-fill text-primary me-2'"></i>
                            <span th:text="${isEdit} ? 'Edit Assignment' : 'Add New Assignment'">Assignment Form</span>
                        </h1>
                        <p class="text-muted small mb-0"
                           th:text="${isEdit} ? 'Update assignment details, status, and deadline.' : 'Enter your course assignment details below to track upcoming deadlines.'">
                            Form details
                        </p>
                    </div>

                    <!-- Assignment Form (Validated with Spring Bean Validation) -->
                    <form th:action="${isEdit} ? @{/assignments/{id}/edit(id=${assignment.id})} : @{/assignments}"
                          th:object="${assignment}"
                          method="post"
                          novalidate>

                        <!-- Hidden ID if editing -->
                        <input type="hidden" th:if="${isEdit}" th:field="*{id}" />

                        <!-- Title Field (Required: 3 to 100 characters) -->
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Assignment Title <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Distributed Systems Case Study"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                Title error
                            </div>
                            <small class="form-text text-muted">Must be between 3 and 100 characters.</small>
                        </div>

                        <!-- Subject Field (Required) -->
                        <div class="mb-3">
                            <label for="subject" class="form-label">
                                Subject / Course <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="subject"
                                   th:field="*{subject}"
                                   th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Advanced Internet Programming, Machine Learning"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}">
                                Subject error
                            </div>
                        </div>

                        <!-- 2-Column Row: Due Date & Priority -->
                        <div class="row g-3 mb-3">
                            <!-- Due Date (Required) -->
                            <div class="col-12 col-sm-6">
                                <label for="dueDate" class="form-label">
                                    Due Date <span class="text-danger">*</span>
                                </label>
                                <input type="date"
                                       class="form-control"
                                       id="dueDate"
                                       th:field="*{dueDate}"
                                       th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid' : ''"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">
                                    Due date error
                                </div>
                            </div>

                            <!-- Priority (Enum: LOW, MEDIUM, HIGH) -->
                            <div class="col-12 col-sm-6">
                                <label for="priority" class="form-label">
                                    Priority <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="priority" th:field="*{priority}">
                                    <option th:each="p : ${priorities}"
                                            th:value="${p}"
                                            th:text="${p.displayName}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Status Field (Only shown on Edit or defaults to Pending) -->
                        <div class="mb-3">
                            <label for="status" class="form-label">
                                Status
                            </label>
                            <select class="form-select" id="status" th:field="*{status}">
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s.displayName}"></option>
                            </select>
                            <small class="form-text text-muted" th:if="${!isEdit}">
                                Defaults to Pending. You can mark it completed anytime from the dashboard or list table.
                            </small>
                        </div>

                        <!-- Description Field (Optional) -->
                        <div class="mb-4">
                            <label for="description" class="form-label">
                                Description / Notes <span class="text-muted">(Optional)</span>
                            </label>
                            <textarea class="form-control"
                                      id="description"
                                      th:field="*{description}"
                                      rows="3"
                                      placeholder="Add project guidelines, submission portal links, professor instructions..."></textarea>
                            <small class="form-text text-muted">Maximum 1000 characters.</small>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a th:href="@{/assignments}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4 shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i>
                                <span th:text="${isEdit} ? 'Update Assignment' : 'Save Assignment'">Save</span>
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Scripts -->
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
